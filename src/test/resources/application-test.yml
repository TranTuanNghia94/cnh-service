spring:
  datasource:
    url: jdbc:h2:mem:cnh_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  redis:
    host: localhost
    port: 6379

jwt:
  secret: test-secret-key-for-unit-tests-must-be-long-enough
  expiration: 3600000
  refresh-expiration: 7200000

webauthn:
  rp-id: localhost
  rp-name: CNH WMS Test
  origins: http://localhost:3000
  challenge-ttl-seconds: 300
